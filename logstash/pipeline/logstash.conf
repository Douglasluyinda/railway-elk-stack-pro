# Authenticated JSON intake on :8080 -> Elasticsearch.
# Required env: INPUT_USER, INPUT_PASSWORD, ES_URL, ES_USER, ES_PASSWORD
# Logstash fails to start if one of these is missing, which is intentional.

input {
  http {
    host => "::"
    port => 8080
    user => "${INPUT_USER}"
    password => "${INPUT_PASSWORD}"
  }
}

filter {
  mutate {
    # Never index request headers: they contain the Authorization header.
    remove_field => ["headers"]
    add_field => { "environment" => "${RAILWAY_ENVIRONMENT_NAME:unknown}" }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_URL}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "railway-logs-%{+YYYY.MM.dd}"
    # The template and retention policy are created by the Elasticsearch service,
    # so the writer role needs no template or ILM privileges.
    manage_template => false
    ilm_enabled => false
    data_stream => "false"
  }
}
