input {
  tcp {
    port => 5044
    codec => json
  }
  http {
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => { "environment" => "railway-production" }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}"]
    index => "railway-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
